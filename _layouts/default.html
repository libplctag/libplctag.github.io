<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #fff;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1rem 2rem;
        }

        h1, h2, h3, h4, h5, h6 {
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        h1 {
            font-size: 2rem;
            border-bottom: 1px solid #e1e4e8;
            padding-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.5rem;
        }

        h3 {
            font-size: 1.25rem;
        }

        p {
            margin-bottom: 1rem;
        }

        ul, ol {
            margin: 1rem 0 1rem 1.5rem;
        }

        li {
            margin-bottom: 0.5rem;
        }

        a {
            color: #0366d6;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        code {
            background-color: #f6f8fa;
            padding: 0.2em 0.4em;
            margin: 0;
            font-size: 0.85em;
            border-radius: 3px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        pre {
            background-color: #f6f8fa;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            margin: 1rem 0;
        }

        pre code {
            background-color: transparent;
            padding: 0;
            border-radius: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #e1e4e8;
        }

        th {
            background-color: #f6f8fa;
            font-weight: 600;
            text-align: center;
        }

        td {
            text-align: center;
        }

        tbody tr:hover {
            background-color: #f6f8fa;
        }

        h1 + table {
            border: none;
            margin-top: 2rem;
        }

        h1 + table td {
            border: none;
            padding: 0 1.5rem 0 0;
            text-align: left;
            vertical-align: top;
        }

        h1 + table tr:hover {
            background-color: transparent;
        }

        h1 + table td:first-child {
            width: 33%;
            padding-right: 2rem;
        }

        h1 + table td:first-child img {
            width: 100%;
            margin: 0;
        }

        h1 + table td:last-child {
            width: 67%;
            padding-left: 0;
        }

        img {
            max-width: 100%;
            height: auto;
            margin: 1rem 0;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            background-color: #f6f8fa;
            border: 1px solid #e1e4e8;
            border-radius: 3px;
            font-size: 0.85rem;
        }

        footer {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #e1e4e8;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        hr {
            border: none;
            border-top: 2px solid #e1e4e8;
            margin: 2rem 0;
        }
    </style>
</head>
<body>
    <main>
        {{ content }}
    </main>

    <footer>
        <p>&copy; libplctag - Free and open source under MPL 2.0 or LGPL 2+</p>
    </footer>
</body>
</html>
